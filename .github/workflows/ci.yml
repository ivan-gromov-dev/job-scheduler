name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore JobScheduler.slnx

      - name: Verify formatting
        run: dotnet format JobScheduler.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build JobScheduler.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JobScheduler.slnx --configuration Release --no-build

      - name: Audit dependencies
        run: dotnet package list --project JobScheduler.slnx --vulnerable --include-transitive --no-restore
